# VoiceShop-CatalogCuration: loads the synthetic catalog that ships in this
# package (catalog/*.zip) into S3, DynamoDB and OpenSearch Serverless.
version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      # Hashed lock (requirements.in -> requirements.txt, by uv): every package and its hash pinned.
      # Quoted: unquoted, YAML reads ":all: " as a mapping key.
      - 'pip install --quiet --require-hashes --no-deps --only-binary :all: -r requirements.txt'
  build:
    commands:
      - python3 -u curate.py
